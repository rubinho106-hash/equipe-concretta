<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Concretta • Apontador</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f2f4f9;--surface:#ffffff;--surface-2:#f8f9fc;--ink:#151b2c;--muted:#626e88;--line:#e2e6f0;
  --accent:#2451d6;--accent-ink:#ffffff;
  --hero-1:#0b1330;--hero-2:#1c3fb8;
  --good-bg:#dcf3e6;--good-ink:#157a4a;
  --warn-bg:#fbe6d4;--warn-ink:#a85417;
  --danger-ink:#b3261e;
  --shadow:0 1px 2px rgba(20,26,50,.04), 0 8px 24px rgba(20,26,50,.06);
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}

.hero{
  background:linear-gradient(135deg, var(--hero-1) 0%, var(--hero-2) 130%);
  border-radius:var(--radius);
  padding:22px 24px;
  color:#f5f7ff;
}
.hero-eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#a9bdfb;margin-bottom:8px}
.hero h1{margin:0;font-size:24px;font-weight:800;color:#fff}
.hero-sub{font-size:13px;color:#cbd5f7;margin-top:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px;box-shadow:var(--shadow)}
label{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin:8px 0 6px}
select,input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

button{font:inherit;border:0;border-radius:9px;padding:11px 14px;font-weight:700;font-size:13.5px;color:#fff;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent)}
.success{background:var(--good-ink)}
.danger{background:var(--danger-ink)}
.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}

.emp-list{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grupo-titulo{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:16px 2px 0}
.emp{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);padding:13px 14px;font-size:15px;text-align:left;cursor:pointer}
.emp:last-child{border-bottom:0}
.emp:hover:not(:disabled){background:var(--surface-2)}
.emp-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.emp-name{min-width:0;flex:1;font-weight:600}

.status{font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;padding:6px 12px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.status.full{color:var(--good-ink);background:var(--good-bg)}
.status.half{color:var(--warn-ink);background:var(--warn-bg)}
.status.absent{color:var(--danger-ink);background:rgba(179,38,30,.12)}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.sum{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.sum b{display:block;font-size:19px;color:var(--ink)}
.sum span{font-size:10.5px;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}

.notice{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.notice b{color:var(--ink)}

.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 20px 50px rgba(15,23,42,.25)}
.modal h3{margin:0 0 2px;font-size:18px;color:var(--ink)}
.modal .sub{color:var(--muted);font-size:12.5px}
.choices{display:grid;gap:8px;margin-top:14px}
.choice{border:0;border-radius:10px;padding:14px;font-size:14.5px;font-weight:700;color:#fff}
.fullbtn{background:var(--good-ink)}
.halfbtn{background:var(--warn-ink)}
.absentbtn{background:var(--danger-ink)}
.cancelbtn{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}

.closed-banner{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--warn-bg);border:1px solid #f0c49a;color:var(--warn-ink);font-size:13px;font-weight:600}

@media(max-width:620px){
  .grid{grid-template-columns:1fr}
  .summary{grid-template-columns:repeat(2,1fr)}
  .emp{font-size:15.5px;padding:15px 14px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="hero-eyebrow">GESTÃO DE PONTO · CONCRETTA</div>
    <h1>Apontador</h1>
    <div class="hero-sub">Lançamento rápido por obra e exceções</div>
  </div>

  <div class="card">
    <div class="grid">
      <div>
        <label>Obra</label>
        <select id="obra"></select>
      </div>
      <div>
        <label>Data</label>
        <input id="data" type="date">
      </div>
    </div>

    <div class="row" style="margin-top:14px">
      <button id="todosDia" class="success">✓ Marcar equipe — Dia inteiro</button>
      <span id="count" class="status">0 funcionários</span>
    </div>

    <div id="fechadoBanner" class="closed-banner" style="display:none">Dia fechado. Os lançamentos estão bloqueados até reabrir.</div>

    <div style="margin-top:12px">
      <input id="buscaFunc" type="text" placeholder="🔍 Buscar funcionário...">
    </div>

    <div id="funcionarios">
      <div style="padding:16px;color:var(--muted)">Carregando equipe…</div>
    </div>

    <div class="summary">
      <div class="sum"><b id="sFull">0</b><span>Inteiros</span></div>
      <div class="sum"><b id="sHalf">0</b><span>Meio período</span></div>
      <div class="sum"><b id="sAbsent">0</b><span>Faltas</span></div>
      <div class="sum"><b id="sPending">0</b><span>Pendentes</span></div>
    </div>

    <div class="notice">
      <b>Total equivalente:</b> <span id="totalDiarias">0</span> diária(s)
    </div>

    <div class="row" style="margin-top:14px">
      <button id="fecharDia" class="success" disabled>Fechar dia</button>
      <button id="reabrirDia" class="secondary" style="display:none">Reabrir dia</button>
      <button id="limparDia" class="danger">Limpar lançamentos</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalNome">
    <h3 id="modalNome">Funcionário</h3>
    <div class="sub">Selecione a situação</div>
    <div class="choices">
      <button class="choice fullbtn" data-status="full">Dia inteiro • 1 diária</button>
      <button class="choice halfbtn" data-status="morning">Manhã • 0,5 diária</button>
      <button class="choice halfbtn" data-status="afternoon">Tarde • 0,5 diária</button>
      <button class="choice absentbtn" data-status="absent">Falta • 0</button>
      <button class="choice cancelbtn" id="cancelar">Cancelar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
// ---------------- Firebase (mesmo projeto do index.html/cartoes.html) ----------------
const firebaseConfig = {
  apiKey: "AIzaSyDk6dqvQZV2kJlkAX7FxpOOQVSDboRb65Q",
  authDomain: "concretta-equipe.firebaseapp.com",
  projectId: "concretta-equipe",
  storageBucket: "concretta-equipe.firebasestorage.app",
  messagingSenderId: "523832637233",
  appId: "1:523832637233:web:9e381b6a53cd2f746ca210"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// PASSO 5 do roadmap (04/09/2026): os lançamentos deixam de ir pro
// localStorage e passam a gravar direto em
// funcionarios/{funcId}/pontos/{AAAA-MM} -- o MESMO documento que o
// cartão do admin (index.html) e a tela Apontamentos leem/escrevem. Um
// lançamento feito aqui já aparece nos dois assim que salva. O modelo de
// dado muda de "um registro por funcionário+obra+data" (localStorage) pra
// "um dia com m/t" compartilhado entre obras -- por isso as regras de
// conflito e a antiga função complementar() saem: com dado real, marcar
// manhã numa obra e tarde noutra já É complementar por natureza (cada
// período grava sua própria obra, sem precisar de lógica extra pra
// permitir isso). Só "Fechar dia"/"Reabrir dia" continuam em
// localStorage por enquanto -- isso é o Passo 7, ainda não feito.

// Mesma lógica de corAvatar()/iniciais() do site principal -- paleta
// idêntica, então o mesmo funcionário cai na mesma cor em todo canto.
const AVATAR_COLORS = ["#2451d6","#157a4a","#a85417","#7c3aed","#0f766e","#be185d","#4338ca","#b45309"];
function corAvatar(nome){
  let h = 0;
  for(let i = 0; i < nome.length; i++) h = (h * 31 + nome.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function iniciais(nome){
  const partes = nome.trim().split(/\s+/);
  const a = partes[0] ? partes[0][0] : "";
  const b = partes.length > 1 ? partes[partes.length - 1][0] : "";
  return (a + b).toUpperCase();
}

// Mesmo conceito de marcador do index.html/cartoes.html -- SÁBADO/DOMINGO/
// FERIADO/FALTA não são obra, então nunca contam como trabalho real.
const MARCADORES = ["SÁBADO", "DOMINGO", "FERIADO", "FALTA"];
function ehMarcador(v){ return MARCADORES.includes(v); }

const obra=document.getElementById("obra");
const data=document.getElementById("data");
const lista=document.getElementById("funcionarios");
const backdrop=document.getElementById("backdrop");
const modalNome=document.getElementById("modalNome");
let atual=null; // funcionário (objeto {id, nome, ...}) com o modal aberto

let OBRAS = [];
let todos = []; // funcionários Ativos, [{id, nome, funcao, status, ...}]
let dadosMes = {}; // funcId -> { dias: {...} } do mes atualmente carregado
let mesCarregado = null; // "AAAA-MM" -- qual mes esta em dadosMes agora
let fechadoAtual = false; // se a combinacao obra+data selecionada agora esta fechada

function mesDaData(){ return data.value.slice(0,7); }
function diaDaData(){ return Number(data.value.split("-")[2]); }

async function carregarDadosMes(mes){
  mesCarregado = mes;
  await Promise.all(todos.map(async f => {
    const snap = await db.doc("funcionarios/" + f.id + "/pontos/" + mes).get();
    dadosMes[f.id] = snap.exists ? snap.data() : { dias: {} };
  }));
}

// Igual garantirDocPontos() do index.html -- cria o doc do mes pre-
// preenchido com SABADO/DOMINGO se ainda nao existir, mantendo o mesmo
// formato que o resto do sistema espera (inclusive statusConferencia,
// que a Conferencia de Ponto usa).
async function garantirDocPontos(funcId, mes){
  const ref = db.doc("funcionarios/" + funcId + "/pontos/" + mes);
  const snap = await ref.get();
  if(snap.exists) return ref;
  const [anoNum, mesNum] = mes.split("-").map(Number);
  const totalDias = new Date(anoNum, mesNum, 0).getDate();
  const dias = {};
  for(let dia = 1; dia <= totalDias; dia++){
    const wd = new Date(anoNum, mesNum - 1, dia).getDay();
    if(wd === 0) dias[dia] = { m: "DOMINGO", t: "DOMINGO" };
    else if(wd === 6) dias[dia] = { m: "SÁBADO", t: "SÁBADO" };
  }
  await ref.set({ dias, statusConferencia: { q1: "Pendente", q2: "Pendente" } });
  return ref;
}

async function iniciarDados(){
  try {
    const [obrasSnap, funcSnap] = await Promise.all([
      db.collection("obras").orderBy("nome").get(),
      db.collection("funcionarios").orderBy("nome").get()
    ]);
    OBRAS = obrasSnap.docs.map(d => d.data().nome);
    todos = funcSnap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(f => f.status !== "Inativo");
  } catch(e){
    lista.innerHTML = '<div style="padding:16px;color:var(--danger-ink)">Não deu pra carregar os dados agora — recarregue a página.</div>';
    return;
  }

  obra.innerHTML = "";
  OBRAS.forEach(o=>{
    const op=document.createElement("option");
    op.value=o;op.textContent=o;obra.appendChild(op);
  });

  await carregarDadosMes(mesDaData());
  await carregarFechado();
  render();
}

function dataLocalHoje(){
  const agora = new Date();
  const ano = agora.getFullYear();
  const mes = String(agora.getMonth() + 1).padStart(2, "0");
  const dia = String(agora.getDate()).padStart(2, "0");
  return `${ano}-${mes}-${dia}`;
}
data.value = dataLocalHoje();
data.max = dataLocalHoje();

// PASSO 7 do roadmap (04/09/2026): "Fechar dia" deixa de ser por mes (o
// antigo fechamentos/{AAAA-MM}, ja removido do sistema) e tambem deixa de
// ser so localStorage (como era ate aqui) -- agora e por Data+Obra,
// gravado numa colecao nova e compartilhada,
// fechamentosDia/{AAAA-MM-DD_OBRA}. Isso combina melhor com o jeito real
// de trabalhar: cada obra fecha o dia dela quando termina de apontar,
// independente das outras obras e sem depender do mes inteiro.
function chaveFechamento(){ return data.value + "_" + obra.value; }
async function carregarFechado(){
  const snap = await db.doc("fechamentosDia/" + chaveFechamento()).get();
  fechadoAtual = snap.exists && !!snap.data().fechado;
}
function isFechado(){ return fechadoAtual; }

function diaDoFuncionario(funcId){
  return ((dadosMes[funcId]||{}).dias||{})[diaDaData()] || {};
}
// Status exibido é sempre relativo à obra selecionada no momento (mesmo
// comportamento já testado nos passos anteriores) -- se a pessoa tiver um
// lançamento real em OUTRA obra nesse dia, aqui aparece "Não lançado" (a
// obra ainda não tem nada registrado dela), mas a checagem de conflito em
// aplicarLancamento() enxerga esse valor e avisa antes de sobrescrever.
// Falta é sempre dia inteiro (Modelo A) e aparece igual não importa qual
// obra está selecionada, já que não é uma obra.
function statusParaExibir(funcId){
  const { m="", t="" } = diaDoFuncionario(funcId);
  if(m === "FALTA" || t === "FALTA") return {txt:"Falta • 0",cls:"absent"};
  const mAqui = m === obra.value;
  const tAqui = t === obra.value;
  if(mAqui && tAqui) return {txt:"Dia inteiro • 1",cls:"full"};
  if(mAqui) return {txt:"Manhã • 0,5",cls:"half"};
  if(tAqui) return {txt:"Tarde • 0,5",cls:"half"};
  return {txt:"Não lançado",cls:"pending"};
}
function valorNestaObra(funcId){
  const { m="", t="" } = diaDoFuncionario(funcId);
  return (m===obra.value?0.5:0) + (t===obra.value?0.5:0);
}
function dataValidaParaLancamento(){
  const hoje = dataLocalHoje();
  if(data.value > hoje){
    data.value = hoje;
    alert("Não é permitido lançar ponto em data futura. A data foi ajustada para hoje.");
    return false;
  }
  return true;
}

function montaLinhaFuncionario(f){
  const st=statusParaExibir(f.id);
  const b=document.createElement("button");
  b.className="emp";b.type="button";b.disabled=isFechado();
  b.innerHTML=`<span class="emp-avatar" style="background:${corAvatar(f.nome)}">${iniciais(f.nome)}</span>`
    +`<span class="emp-name">${f.nome}</span><span class="status ${st.cls}">${st.txt}</span>`;
  b.addEventListener("click",()=>abrir(f));
  return b;
}

// "Equipe da obra" -- combina dois sinais, nenhum dos dois restringe quem
// pode ser tocado (a busca sempre enxerga todo mundo em "outros"):
// (1) ultimaObraNome/ultimaObraData -- ultimo lancamento real nessa obra,
// gravado por qualquer um dos dois apps em aplicarLancamento()/salvarDia();
// (2) obraPadrao -- cadastro manual feito no funcionario (index.html,
// "Obra padrão"), pra quem ainda nao tem lancamento recente mas e esperado
// ali por cadastro.
// Quem tem lancamento real recente vem primeiro (mais recente no topo);
// quem entrou so pelo cadastro manual vem depois, em ordem alfabetica.
// Usada tanto pro agrupamento visual (render()) quanto pro escopo real do
// "Marcar todos" (que so deve tocar quem esta cadastrado/ativo nessa obra
// -- pra outra obra, o apontador busca o nome e marca individualmente).
function equipeDaObra(lista){
  return lista
    .filter(f=>f.ultimaObraNome===obra.value || f.obraPadrao===obra.value)
    .sort((a,b)=>{
      const da=(a.ultimaObraNome===obra.value && a.ultimaObraData) || "";
      const db=(b.ultimaObraNome===obra.value && b.ultimaObraData) || "";
      if(da!==db) return db.localeCompare(da);
      return (a.nome||"").localeCompare(b.nome||"");
    });
}

function render(){
  const termoBusca=(document.getElementById("buscaFunc").value||"").trim().toLowerCase();
  // "equipe" (sem filtro de busca) e a base de tudo que e resumo/contagem
  // dessa obra -- contador do topo, os 4 cards de status e o gate do
  // "Fechar dia". Antes isso somava os 26 Ativos da empresa inteira,
  // sempre mostrando "26 pendentes" mesmo numa obra com 4 cadastrados de
  // verdade (nunca zerava, "Fechar dia" ficava preso pra sempre).
  const equipe=equipeDaObra(todos);
  document.getElementById("count").textContent=`${equipe.length} funcionário${equipe.length===1?"":"s"}`;

  lista.innerHTML="";

  if(!todos.length){
    lista.innerHTML='<div style="padding:16px;color:var(--muted)">Nenhum funcionário ativo cadastrado.</div>';
  } else {
    const filtrados=termoBusca
      ? todos.filter(f=>f.nome.toLowerCase().includes(termoBusca))
      : todos;

    if(!filtrados.length){
      lista.innerHTML='<div style="padding:16px;color:var(--muted)">Nenhum funcionário encontrado.</div>';
    } else {
      const provavel=equipeDaObra(filtrados);
      const provavelIds=new Set(provavel.map(f=>f.id));
      const outros=filtrados.filter(f=>!provavelIds.has(f.id));

      if(provavel.length){
        const tituloProvavel=document.createElement("div");
        tituloProvavel.className="grupo-titulo";
        tituloProvavel.textContent="Equipe da obra";
        lista.appendChild(tituloProvavel);

        const listaProvavel=document.createElement("div");
        listaProvavel.className="emp-list";
        provavel.forEach(f=>listaProvavel.appendChild(montaLinhaFuncionario(f)));
        lista.appendChild(listaProvavel);
      }

      // "Outros funcionários ativos" so aparece quando tem busca digitada --
      // sem busca, a lista fica so na Equipe da obra (o Rubens achou a
      // lista completa sempre visivel poluida). Ninguem fica inacessivel:
      // digitar o nome de qualquer ativo encontra e deixa apontar normal.
      if(termoBusca && outros.length){
        const tituloOutros=document.createElement("div");
        tituloOutros.className="grupo-titulo";
        tituloOutros.textContent="Outros funcionários ativos";
        lista.appendChild(tituloOutros);

        const listaOutros=document.createElement("div");
        listaOutros.className="emp-list";
        outros.forEach(f=>listaOutros.appendChild(montaLinhaFuncionario(f)));
        lista.appendChild(listaOutros);
      }

      if(!provavel.length && !termoBusca){
        const dica=document.createElement("div");
        dica.style.cssText="padding:16px;color:var(--muted)";
        dica.textContent="Ninguém cadastrado nessa obra ainda. Busque pelo nome pra lançar alguém.";
        lista.appendChild(dica);
      }
    }
  }

  // resumo/estatisticas sao sobre a equipe da obra (nao os 26 Ativos da
  // empresa) -- a busca e so pra achar alguem na lista, nao e um filtro
  // de relatorio, mas o relatorio em si agora e por obra, nao global.
  let full=0, half=0, absent=0, pending=0, total=0;
  equipe.forEach(f=>{
    const st=statusParaExibir(f.id);
    if(st.cls==="full") full++;
    else if(st.cls==="half") half++;
    else if(st.cls==="absent") absent++;
    else pending++;
    total += valorNestaObra(f.id);
  });

  document.getElementById("sFull").textContent=full;
  document.getElementById("sHalf").textContent=half;
  document.getElementById("sAbsent").textContent=absent;
  document.getElementById("sPending").textContent=pending;
  document.getElementById("totalDiarias").textContent=total.toLocaleString("pt-BR");

  const fechado=isFechado();
  document.getElementById("fechadoBanner").style.display=fechado?"block":"none";
  document.getElementById("todosDia").disabled=fechado||!equipe.length;
  document.getElementById("limparDia").disabled=fechado;
  document.getElementById("fecharDia").style.display=fechado?"none":"inline-block";
  document.getElementById("reabrirDia").style.display=fechado?"inline-block":"none";
  document.getElementById("fecharDia").disabled=pending>0||!equipe.length;
}

function abrir(f){
  if(!dataValidaParaLancamento())return;
  if(isFechado())return;
  atual=f;modalNome.textContent=f.nome;backdrop.style.display="flex";
}
function fecharModal(){atual=null;backdrop.style.display="none"}

// Grava a cache de "ultima obra" (mesma logica do salvarDia() no
// index.html) -- so quando o resultado final e uma obra real, nunca pra
// falta. Fire-and-forget pro Firestore (se falhar, nao deve travar o
// lancamento), mas atualiza o objeto local em `todos` na hora -- sem
// isso, o render() chamado logo depois (aqui mesmo ou no "Marcar todos")
// usava o valor antigo de ultimaObraNome e a pessoa so entrava em
// "Equipe da obra" depois de recarregar a pagina inteira.
function atualizarUltimaObra(funcId){
  const dataStr = mesCarregado + "-" + String(diaDaData()).padStart(2,"0");
  const f = todos.find(x => x.id === funcId);
  if(f){
    f.ultimaObraId = obra.value;
    f.ultimaObraNome = obra.value;
    f.ultimaObraData = dataStr;
  }
  db.doc("funcionarios/" + funcId).update({
    ultimaObraId: obra.value,
    ultimaObraNome: obra.value,
    ultimaObraData: dataStr
  }).catch(()=>{});
}

// Grava de verdade em funcionarios/{funcId}/pontos/{mes}, direto nos
// campos dias.{dia}.m/dias.{dia}.t -- o mesmo doc que index.html e
// cartoes.html leem. Le o estado atual (dadosMes, ja carregado) pra
// decidir se ha conflito com uma obra diferente ja lancada, ou se precisa
// limpar uma Falta orfa (Modelo A: falta nunca fica so num periodo).
async function aplicarLancamento(func, status){
  const dia = diaDaData();
  const diaAtual = diaDoFuncionario(func.id);
  const m = diaAtual.m || "", t = diaAtual.t || "";
  const mReal = m && !ehMarcador(m);
  const tReal = t && !ehMarcador(t);
  const obraSel = obra.value;

  if(status === "absent"){
    // Falta = Modelo A, dia inteiro -- se ja tem trabalho real lancado
    // (nessa obra ou noutra), confirma antes de apagar e sobrescrever.
    if(mReal || tReal){
      const obraExistente = mReal ? m : t;
      const ok = confirm(`${func.nome} já tem "${obraExistente}" lançado nesse dia.\n\nMarcar Falta apaga esse lançamento e deixa o dia inteiro como falta. Confirma?`);
      if(!ok) return false;
    }
    const ref = await garantirDocPontos(func.id, mesCarregado);
    await ref.update({ ["dias."+dia+".m"]:"FALTA", ["dias."+dia+".t"]:"FALTA" });
    const snap = await ref.get();
    dadosMes[func.id] = snap.data();
    return true;
  }

  const alvoM = status==="full" || status==="morning";
  const alvoT = status==="full" || status==="afternoon";
  const conflitoM = alvoM && mReal && m!==obraSel;
  const conflitoT = alvoT && tReal && t!==obraSel;
  if(conflitoM || conflitoT){
    const obraConflito = conflitoM ? m : t;
    const ok = confirm(`${func.nome} já possui lançamento na obra "${obraConflito}" nesta data.\n\nDeseja substituir por "${obraSel}"?`);
    if(!ok) return false;
  }

  const upd = {};
  if(alvoM) upd["dias."+dia+".m"] = obraSel;
  if(alvoT) upd["dias."+dia+".t"] = obraSel;
  // limpa uma Falta orfa do periodo que NAO esta sendo gravado agora
  if(!alvoT && t==="FALTA") upd["dias."+dia+".t"] = "";
  if(!alvoM && m==="FALTA") upd["dias."+dia+".m"] = "";

  const ref = await garantirDocPontos(func.id, mesCarregado);
  await ref.update(upd);
  const snap = await ref.get();
  dadosMes[func.id] = snap.data();
  atualizarUltimaObra(func.id);
  return true;
}

async function aplicar(status){
  if(!atual)return;
  const func = atual;
  fecharModal();
  const ok = await aplicarLancamento(func, status);
  if(!ok){
    render();
    return;
  }
  render();
}

document.querySelectorAll("[data-status]").forEach(b=>{
  b.addEventListener("click",()=>aplicar(b.dataset.status));
});
document.getElementById("cancelar").addEventListener("click",fecharModal);
backdrop.addEventListener("click",e=>{if(e.target===backdrop)fecharModal()});

document.getElementById("todosDia").addEventListener("click",async ()=>{
  if(!dataValidaParaLancamento())return;
  if(isFechado())return;
  const dia = diaDaData();
  const obraSel = obra.value;
  const conflitos=[];

  // So marca quem esta na "Equipe da obra" (cadastrado via obraPadrao ou
  // com lancamento recente ali) -- alguem de outra obra que precise ser
  // lancado aqui e feito buscando o nome e marcando individualmente, nao
  // por esse botao (pedido do Rubens, depois de "Marcar todos" ter
  // marcado os 26 ativos inteiros por engano num teste).
  // sequencial (nao Promise.all) pra evitar corrida de escritas no mesmo
  // funcionario e manter dadosMes sempre consistente entre uma pessoa e
  // outra -- e um botao usado raramente, alguns segundos a mais aqui nao
  // pesam.
  for(const f of equipeDaObra(todos)){
    const diaAtual = diaDoFuncionario(f.id);
    const m = diaAtual.m || "", t = diaAtual.t || "";
    const mRealDiferente = m && !ehMarcador(m) && m !== obraSel;
    const tRealDiferente = t && !ehMarcador(t) && t !== obraSel;
    if(mRealDiferente || tRealDiferente){
      conflitos.push(`${f.nome} (${mRealDiferente ? m : t})`);
      continue;
    }
    const ref = await garantirDocPontos(f.id, mesCarregado);
    await ref.update({ ["dias."+dia+".m"]: obraSel, ["dias."+dia+".t"]: obraSel });
    const snap = await ref.get();
    dadosMes[f.id] = snap.data();
    atualizarUltimaObra(f.id);
  }

  if(conflitos.length){
    alert("Alguns funcionários não foram alterados porque já estão lançados em outra obra:\n\n"+conflitos.join("\n"));
  }
  render();
});

document.getElementById("fecharDia").addEventListener("click",async ()=>{
  if(!dataValidaParaLancamento())return;
  const pendentes=equipeDaObra(todos).filter(f=>statusParaExibir(f.id).cls==="pending");
  if(pendentes.length){
    alert("Ainda existem funcionários pendentes.");
    return;
  }
  if(!confirm(`Fechar o dia ${data.value.split("-").reverse().join("/")} da obra ${obra.value}?\n\nDepois disso os lançamentos ficarão bloqueados.`))return;
  await db.doc("fechamentosDia/" + chaveFechamento()).set({
    obra: obra.value,
    data: data.value,
    fechado: true,
    atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });
  fechadoAtual = true;
  render();
});

document.getElementById("reabrirDia").addEventListener("click",async ()=>{
  if(!confirm("Reabrir este dia para permitir correções?"))return;
  await db.doc("fechamentosDia/" + chaveFechamento()).set({
    fechado: false,
    atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });
  fechadoAtual = false;
  render();
});

document.getElementById("limparDia").addEventListener("click",async ()=>{
  if(!confirm("Apagar os lançamentos desta obra nesta data?"))return;
  const dia = diaDaData();
  const obraSel = obra.value;
  const dataStr = mesCarregado + "-" + String(dia).padStart(2,"0");
  for(const f of todos){
    const diaAtual = diaDoFuncionario(f.id);
    const upd = {};
    if(diaAtual.m === obraSel) upd["dias."+dia+".m"] = "";
    if(diaAtual.t === obraSel) upd["dias."+dia+".t"] = "";
    if(Object.keys(upd).length){
      const ref = await garantirDocPontos(f.id, mesCarregado);
      await ref.update(upd);
      const snap = await ref.get();
      dadosMes[f.id] = snap.data();
    }
    // se o cache de "ultima obra" apontava exatamente pra esse dia+obra que
    // acabou de ser apagado, ele ficaria orfao (gruda em "Equipe da obra"
    // pra sempre, mesmo sem lancamento nenhum) -- limpa junto.
    if(f.ultimaObraNome === obraSel && f.ultimaObraData === dataStr){
      f.ultimaObraId = "";
      f.ultimaObraNome = "";
      f.ultimaObraData = "";
      db.doc("funcionarios/" + f.id).update({
        ultimaObraId: firebase.firestore.FieldValue.delete(),
        ultimaObraNome: firebase.firestore.FieldValue.delete(),
        ultimaObraData: firebase.firestore.FieldValue.delete()
      }).catch(()=>{});
    }
  }
  render();
});

obra.addEventListener("change",async ()=>{
  await carregarFechado();
  render();
});
data.addEventListener("change",async ()=>{
  dataValidaParaLancamento();
  const novoMes = mesDaData();
  if(novoMes !== mesCarregado){
    lista.innerHTML = '<div style="padding:16px;color:var(--muted)">Carregando período…</div>';
    await carregarDadosMes(novoMes);
  }
  await carregarFechado();
  render();
});
document.getElementById("buscaFunc").addEventListener("input",render);

iniciarDados();
